name: vehiculos_app
description: Aplicación de gestión de vehículos y componentes
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.8.3
  intl: ^0.18.1
  mobile_scanner: ^7.4.0
  # ✅ Para importar Excel
  file_picker: ^8.0.0
  excel: ^4.0.3
  # ✅ Para exportar Excel
  path_provider: ^2.1.0
  share_plus: ^10.0.0
  permission_handler: ^11.3.0
  # ✅ Para generar y guardar códigos QR
  qr_flutter: ^4.1.0
  screenshot: ^3.0.0
  gal: ^2.3.0
  # ✅ Para guardar recetas personalizadas
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true